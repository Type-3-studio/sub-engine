<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Serialization Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; touch-action: none; }
    canvas { display: block; }
    #app { width: 100%; height: 100%; }
    #ui { position: absolute; top: 10px; left: 10px; display: flex; flex-direction: column; gap: 8px; font-family: monospace; }
    button { padding: 8px 16px; background: #334466; color: #fff; border: 1px solid #556688; cursor: pointer; font-family: monospace; font-size: 13px; }
    button:hover { background: #445577; }
    pre { background: rgba(0,0,0,0.8); color: #aaccff; padding: 12px; border-radius: 4px; max-height: 500px; overflow: auto; font-size: 12px; width: 580px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="ui">
    <button id="btn-spawn">Spawn Entities</button>
    <button id="btn-save">Save State</button>
    <button id="btn-load">Load State</button>
    <button id="btn-verify">Verify Round-Trip</button>
    <span id="status" style="color:#aaa;font-size:13px;">Ready</span>
    <pre id="output"></pre>
  </div>
  <script type="module">
    import { init } from './client/main.js'
    init()
  </script>
</body>
</html>
